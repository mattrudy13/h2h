<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Basketball Head-to-Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-sport="cbb">

<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="index.html">Head<span>-to-</span>Head</a>
    <nav class="tabs" aria-label="Sport">
      <a href="cfb-h2h.html">Football</a>
      <a href="cbb-h2h.html" aria-current="page">Basketball</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>College Basketball</h1>
    <p>Pick two men's programs to see their all-time series.</p>
  </section>

  <div class="modes" role="group" aria-label="Compare">
    <button type="button" class="mode-btn" data-mode="team" aria-pressed="true">Team vs Team</button>
    <button type="button" class="mode-btn" data-mode="conf" aria-pressed="false">Team vs Conference</button>
  </div>

  <div class="card picker">
    <div class="input-wrap"><span class="input-logo"></span><input id="team1" list="teams" placeholder="Team 1 (e.g. Duke)" autocomplete="off" aria-label="Team 1"></div>
    <button id="swap" class="swap" type="button" title="Swap teams" aria-label="Swap teams">&#8644;</button>
    <div class="input-wrap"><span class="input-logo"></span><input id="team2" list="teams" placeholder="Team 2 (e.g. North Carolina)" autocomplete="off" aria-label="Team 2"></div>
    <div id="conf-wrap" class="input-wrap" hidden><select id="conf" aria-label="Conference"><option value="">Pick a conference</option></select></div>
    <datalist id="teams"></datalist>
    <button id="go">Compare</button>
  </div>

  <div id="status" role="status"></div>
  <div id="suggest"></div>

  <section id="rivalries" class="rivalries">
    <h2>Classic rivalries</h2>
    <div class="chips"></div>
  </section>

  <div id="result"></div>
</main>

<footer class="wrap">Data via <a href="https://collegebasketballdata.com" target="_blank" rel="noopener">CollegeBasketballData.com</a></footer>

<script src="proxy-config.js"></script>
<script src="common.js"></script>
<script>
// Requests go through the Cloudflare Worker in worker/, which adds the API key.
const API_BASE = (window.H2H_PROXY || "").replace(/\/$/, "") + "/cbb";

// Built from the team list once it loads; null until then (or if it fails).
let teamIndex = null;

async function apiFetch(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) {
    throw new Error(`API error ${res.status}: ${await res.text()}`);
  }
  return res.json();
}

async function loadTeams() {
  try {
    const teams = await apiFetch("/teams");
    teamIndex = buildTeamIndex(teams, ["abbreviation", "shortDisplayName", "displayName"],
      t => ({
        color: t.primaryColor, altColor: t.secondaryColor, abbr: t.abbreviation, logos: t.logos,
        conference: t.conference,
      }));
    const names = [...new Set(teams.map(t => t.school))].sort();
    const datalist = document.getElementById("teams");
    datalist.innerHTML = names
      .map(name => `<option value="${esc(name)}">`)
      .join("");
    refreshInputLogos(teamIndex);
    fillConferences(teamIndex);
  } catch (err) {
    setStatus("Couldn't load team list (typing still works): " + err.message, true);
  }
}

// Team vs conference: one request for the team's full game list, then a
// tally per conference member. Only finished games count.
async function fetchVsMembers(team, members, onProgress) {
  const allGames = await apiFetch(`/games?team=${encodeURIComponent(team)}`);
  onProgress(members.length);
  const byOpp = new Map(members.map(m => [m.toLowerCase(), {
    opponent: m, wins: 0, losses: 0, ties: 0, games: 0, lastSeason: null, lastResult: null, lastDate: 0,
  }]));
  for (const g of allGames) {
    if (g.status !== "final") continue;
    const homeIsTeam = g.homeTeam.toLowerCase() === team.toLowerCase();
    const r = byOpp.get((homeIsTeam ? g.awayTeam : g.homeTeam).toLowerCase());
    if (!r) continue;
    const won = homeIsTeam ? g.homeWinner : g.awayWinner;
    const lost = homeIsTeam ? g.awayWinner : g.homeWinner;
    const result = won ? "W" : lost ? "L" : "T";
    r.games++;
    if (result === "W") r.wins++; else if (result === "L") r.losses++; else r.ties++;
    const t = new Date(g.startDate).getTime();
    if (t > r.lastDate) Object.assign(r, { lastDate: t, lastSeason: g.season, lastResult: result });
  }
  return [...byOpp.values()];
}

async function compare() {
  if (getMode() === "conf") return compareConference(teamIndex, fetchVsMembers, compare);
  const raw1 = document.getElementById("team1").value.trim();
  const raw2 = document.getElementById("team2").value.trim();
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";
  clearSuggestions();

  if (!raw1 || !raw2) {
    setStatus("Enter both team names.", true);
    return;
  }
  const picked = resolvePair(raw1, raw2, teamIndex, compare);
  if (!picked) return;
  const { t1, t2, note } = picked;
  if (t1.toLowerCase() === t2.toLowerCase()) {
    setStatus("Pick two different teams.", true);
    return;
  }

  writeTeamsToUrl(t1, t2);
  setStatus("Loading matchup history...");
  renderSkeleton();
  document.getElementById("go").disabled = true;

  try {
    // The basketball API has no dedicated matchup endpoint, so pull every
    // game for team1 and filter down to games against team2 client-side.
    const allGames = await apiFetch(`/games?team=${encodeURIComponent(t1)}`);
    const t2Lower = t2.toLowerCase();
    const matchups = allGames.filter(g =>
      (g.homeTeam || "").toLowerCase() === t2Lower ||
      (g.awayTeam || "").toLowerCase() === t2Lower
    );

    // Unplayed games come back with status "scheduled" and a 0–0 score, so
    // only finished games count toward the record. Future ones are listed as
    // upcoming; past non-final ones (postponed/cancelled) are dropped.
    const now = Date.now();
    const played = matchups.filter(g => g.status === "final");
    const upcoming = matchups.filter(g => g.status !== "final" && new Date(g.startDate) > now);
    const games = [...played, ...upcoming];

    if (games.length === 0) {
      resultEl.innerHTML = "";
      setStatus(`No games found between ${t1} and ${t2}. ${note}`.trim());
      return;
    }

    // Resolve canonical display names from the actual game data.
    const team1Name = games[0].homeTeam.toLowerCase() === t1.toLowerCase() ? games[0].homeTeam : games[0].awayTeam;
    const team2Name = games[0].homeTeam.toLowerCase() === t2Lower ? games[0].homeTeam : games[0].awayTeam;

    let team1Wins = 0, team2Wins = 0, ties = 0;
    for (const g of played) {
      const homeIsTeam1 = g.homeTeam.toLowerCase() === t1.toLowerCase();
      const team1Won = homeIsTeam1 ? g.homeWinner : g.awayWinner;
      const team2Won = homeIsTeam1 ? g.awayWinner : g.homeWinner;
      if (team1Won) team1Wins++;
      else if (team2Won) team2Wins++;
      else ties++;
    }

    const upcomingNote = upcoming.length ? ` · ${upcoming.length} upcoming` : "";
    let metaLine;
    if (played.length) {
      metaLine = `${gamesSummary(played.length, played.map(g => g.season))}${upcomingNote}.`;
    } else {
      metaLine = `No games played yet${upcomingNote}.`;
    }
    setStatus("");

    const rows = [...games]
      .sort((a, b) => new Date(b.startDate) - new Date(a.startDate))
      .map(g => {
        const badges = [];
        if (g.tournament) badges.push({ text: g.tournament, post: true });
        else if (g.seasonType === "postseason") badges.push({ text: "postseason", post: true });
        if (g.neutralSite) badges.push({ text: "Neutral" });
        return {
          date: g.startDate,
          season: g.season,
          badges,
          home: g.homeTeam,
          away: g.awayTeam,
          homePts: g.homePoints,
          awayPts: g.awayPoints,
          winner: g.homeWinner ? g.homeTeam : g.awayWinner ? g.awayTeam : null,
          upcoming: g.status !== "final",
        };
      });

    renderMatchup({
      team1: team1Name,
      team2: team2Name,
      wins1: team1Wins,
      wins2: team2Wins,
      ties,
      metaLine: `${metaLine} ${note}`.trim(),
      rows,
    }, teamIndex);
  } catch (err) {
    resultEl.innerHTML = "";
    setStatus("Error: " + err.message, true);
  } finally {
    document.getElementById("go").disabled = false;
  }
}

document.getElementById("go").addEventListener("click", compare);
initSwap(compare, () => teamIndex);
initCopyLink();
initInputLogos(() => teamIndex);
initModes(compare);
initChartTips();
initRivalries([
  ["Duke", "North Carolina"],
  ["Kansas", "Kentucky"],
  ["Indiana", "Purdue"],
  ["Louisville", "Kentucky"],
  ["UConn", "Villanova"],
], compare);
document.getElementById("team2").addEventListener("keydown", e => { if (e.key === "Enter") compare(); });
document.getElementById("team1").addEventListener("keydown", e => { if (e.key === "Enter") compare(); });

if (!window.H2H_PROXY) {
  setStatus("No proxy URL set — set window.H2H_PROXY in proxy-config.js.", true);
} else {
  loadTeams().then(() => autoRunFromUrl(compare));
}
</script>

</body>
</html>
