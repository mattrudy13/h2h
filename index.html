<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Head-to-Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-sport="cfb">

<header class="site-head wrap">
  <a class="brand" href="index.html"><span class="brand-tag slant">H2H</span><span class="brand-name">Head-to-Head</span></a>
</header>

<main class="wrap">
  <section class="home-search">
    <h1>Settle the rivalry</h1>
    <div class="sport-switch" role="group" aria-label="Sport">
      <button type="button" class="slant" data-pick="cfb" aria-pressed="true">Football</button>
      <button type="button" class="slant" data-pick="cbb" aria-pressed="false">Basketball</button>
    </div>
    <div class="picker">
      <div class="field input-wrap">
        <label for="team1">Team 1</label>
        <div class="input-box"><span class="input-logo"></span><input id="team1" list="teams" placeholder="e.g. Michigan" autocomplete="off"></div>
      </div>
      <button id="swap" class="swap" type="button" aria-label="Swap teams">&#8644;</button>
      <div class="field input-wrap">
        <label for="team2">Team 2</label>
        <div class="input-box"><span class="input-logo"></span><input id="team2" list="teams" placeholder="e.g. Ohio State" autocomplete="off"></div>
      </div>
      <datalist id="teams"></datalist>
      <button id="go" class="slant" type="button">Compare</button>
    </div>
    <div id="status" role="status"></div>
    <div id="suggest"></div>
    <a id="conf-link" class="conf-link" href="cfb-h2h.html?mode=conf">Team vs Conference</a>
  </section>

  <section id="recents" class="recents">
    <div class="section-head">
      <h2 class="cap"><span>Recent</span></h2>
      <button type="button" class="link-btn recent-clear">Clear</button>
    </div>
    <div class="recent-list"></div>
    <p class="recent-empty">Matchups you look up show up here, so you can reopen them in one tap. They're saved on this device only.</p>
  </section>
</main>

<footer class="wrap">Data via <a href="https://collegefootballdata.com" target="_blank" rel="noopener">CollegeFootballData.com</a> and <a href="https://collegebasketballdata.com" target="_blank" rel="noopener">CollegeBasketballData.com</a></footer>

<script src="proxy-config.js"></script>
<script src="common.js"></script>
<script>
// The home page searches one sport at a time. Compare resolves the names when
// that sport's team list has loaded (otherwise the sport page does it) and
// opens the matchup there.
const SPORT_KEY = "h2h-sport";
const PLACEHOLDERS = { cfb: ["e.g. Michigan", "e.g. Ohio State"], cbb: ["e.g. Duke", "e.g. North Carolina"] };

// One request per sport per visit, started when that sport is picked.
const indexes = {};
let sport = "cfb";
let teamIndex = null;

async function pickSport(next) {
  sport = next;
  document.body.dataset.sport = next;
  for (const b of document.querySelectorAll("[data-pick]")) b.setAttribute("aria-pressed", String(b.dataset.pick === next));
  document.getElementById("team1").placeholder = PLACEHOLDERS[next][0];
  document.getElementById("team2").placeholder = PLACEHOLDERS[next][1];
  document.getElementById("conf-link").href = `${next}-h2h.html?mode=conf`;
  try { localStorage.setItem(SPORT_KEY, next); } catch { /* storage blocked */ }
  clearSuggestions();
  setStatus("");
  teamIndex = null;
  refreshInputLogos(null);

  indexes[next] ??= loadTeamIndex(next).catch(() => null);
  const index = await indexes[next];
  if (sport !== next || !index) return;
  teamIndex = index;
  fillTeamList(index);
  refreshInputLogos(index);
}

function go() {
  const raw1 = document.getElementById("team1").value.trim();
  const raw2 = document.getElementById("team2").value.trim();
  clearSuggestions();
  if (!raw1 || !raw2) {
    setStatus("Enter both team names.", true);
    return;
  }
  const picked = resolvePair(raw1, raw2, teamIndex, go);
  if (!picked) return;
  if (sameTeam(picked.t1, picked.t2)) {
    setStatus("Pick two different teams.", true);
    return;
  }
  location.href = `${sport}-h2h.html${matchupHref(picked.t1, picked.t2)}`;
}

for (const b of document.querySelectorAll("[data-pick]")) b.addEventListener("click", () => pickSport(b.dataset.pick));
document.getElementById("go").addEventListener("click", go);
for (const id of ["team1", "team2"]) {
  document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
initSwap(go, () => teamIndex);
initInputLogos(() => teamIndex);
initRecents();

let saved = null;
try { saved = localStorage.getItem(SPORT_KEY); } catch { /* storage blocked */ }
if (!window.H2H_PROXY) {
  setStatus("No proxy URL set — set window.H2H_PROXY in proxy-config.js.", true);
} else {
  pickSport(saved === "cbb" ? "cbb" : "cfb");
}
</script>

</body>
</html>
