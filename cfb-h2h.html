<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Football Head-to-Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-sport="cfb">

<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="index.html">Head<span>-to-</span>Head</a>
    <nav class="tabs" aria-label="Sport">
      <a href="cfb-h2h.html" aria-current="page">Football</a>
      <a href="cbb-h2h.html">Basketball</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>College Football</h1>
    <p>Pick two FBS schools to see their all-time series.</p>
  </section>

  <div class="modes" role="group" aria-label="Compare">
    <button type="button" class="mode-btn" data-mode="team" aria-pressed="true">Team vs Team</button>
    <button type="button" class="mode-btn" data-mode="conf" aria-pressed="false">Team vs Conference</button>
  </div>

  <div class="card picker">
    <div class="input-wrap"><span class="input-logo"></span><input id="team1" list="teams" placeholder="Team 1 (e.g. Michigan)" autocomplete="off" aria-label="Team 1"></div>
    <button id="swap" class="swap" type="button" title="Swap teams" aria-label="Swap teams">&#8644;</button>
    <div class="input-wrap"><span class="input-logo"></span><input id="team2" list="teams" placeholder="Team 2 (e.g. Ohio State)" autocomplete="off" aria-label="Team 2"></div>
    <div id="conf-wrap" class="input-wrap" hidden><select id="conf" aria-label="Conference"><option value="">Pick a conference</option></select></div>
    <datalist id="teams"></datalist>
    <button id="go">Compare</button>
  </div>

  <div id="status" role="status"></div>
  <div id="suggest"></div>

  <section id="rivalries" class="rivalries">
    <h2>Classic rivalries</h2>
    <div class="chips"></div>
  </section>

  <div id="result"></div>
</main>

<footer class="wrap">Data via <a href="https://collegefootballdata.com" target="_blank" rel="noopener">CollegeFootballData.com</a></footer>

<script src="proxy-config.js"></script>
<script src="common.js"></script>
<script>
// Requests go through the Cloudflare Worker in worker/, which adds the API key.
const API_BASE = (window.H2H_PROXY || "").replace(/\/$/, "") + "/cfb";

// Built from the team list once it loads; null until then (or if it fails).
let teamIndex = null;

async function apiFetch(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) {
    throw new Error(`API error ${res.status}: ${await res.text()}`);
  }
  return res.json();
}

async function loadTeams() {
  try {
    const teams = await apiFetch("/teams/fbs");
    teamIndex = buildTeamIndex(teams, ["abbreviation", "alternateNames"],
      t => ({
        color: t.color, altColor: t.alternateColor, abbr: t.abbreviation, logos: t.logos,
        conference: t.conference === "FBS Independents" ? null : t.conference,
      }));
    const datalist = document.getElementById("teams");
    datalist.innerHTML = teams
      .map(t => t.school)
      .sort()
      .map(name => `<option value="${esc(name)}">`)
      .join("");
    refreshInputLogos(teamIndex);
    fillConferences(teamIndex);
  } catch (err) {
    setStatus("Couldn't load team list (typing still works): " + err.message, true);
  }
}

// Team vs conference: the API only has a per-pair matchup endpoint, so this
// makes one (Worker-cached) request per conference member, 4 at a time.
async function fetchVsMembers(team, members, onProgress) {
  let done = 0;
  return mapLimit(members, 4, async opponent => {
    const data = await apiFetch(
      `/teams/matchup?team1=${encodeURIComponent(team)}&team2=${encodeURIComponent(opponent)}`
    );
    onProgress(++done);
    const games = data.games || [];
    const last = games.slice().sort((a, b) => (b.season - a.season) || (b.week - a.week))[0];
    const lastResult = !last ? null
      : !last.winner && last.homeScore === last.awayScore ? "T"
      : (last.winner || (last.homeScore > last.awayScore ? last.homeTeam : last.awayTeam)) === team ? "W" : "L";
    return {
      opponent,
      wins: data.team1Wins || 0,
      losses: data.team2Wins || 0,
      ties: data.ties || 0,
      games: games.length,
      lastSeason: last ? last.season : null,
      lastResult,
    };
  });
}

async function compare() {
  if (getMode() === "conf") return compareConference(teamIndex, fetchVsMembers, compare);
  const raw1 = document.getElementById("team1").value.trim();
  const raw2 = document.getElementById("team2").value.trim();
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";
  clearSuggestions();

  if (!raw1 || !raw2) {
    setStatus("Enter both team names.", true);
    return;
  }
  const picked = resolvePair(raw1, raw2, teamIndex, compare);
  if (!picked) return;
  const { t1, t2, note } = picked;
  if (t1.toLowerCase() === t2.toLowerCase()) {
    setStatus("Pick two different teams.", true);
    return;
  }

  writeTeamsToUrl(t1, t2);
  setStatus("Loading matchup history...");
  renderSkeleton();
  document.getElementById("go").disabled = true;

  try {
    const data = await apiFetch(
      `/teams/matchup?team1=${encodeURIComponent(t1)}&team2=${encodeURIComponent(t2)}`
    );

    if (!data.games || data.games.length === 0) {
      resultEl.innerHTML = "";
      setStatus(`No games found between ${t1} and ${t2}. ${note}`.trim());
      return;
    }

    setStatus("");

    const rows = [...data.games]
      .sort((a, b) => (b.season - a.season) || (b.week - a.week))
      .map(g => {
        const badges = [];
        if (g.seasonType && g.seasonType !== "regular") badges.push({ text: g.seasonType, post: true });
        if (g.neutralSite) badges.push({ text: "Neutral" });
        return {
          date: g.date,
          season: g.season,
          badges,
          home: g.homeTeam,
          away: g.awayTeam,
          homePts: g.homeScore,
          awayPts: g.awayScore,
          winner: g.winner || (g.homeScore > g.awayScore ? g.homeTeam : g.awayScore > g.homeScore ? g.awayTeam : null),
          upcoming: false,
        };
      });

    renderMatchup({
      team1: data.team1,
      team2: data.team2,
      wins1: data.team1Wins,
      wins2: data.team2Wins,
      ties: data.ties || 0,
      metaLine: `${gamesSummary(data.games.length, data.games.map(g => g.season))}. ${note}`.trim(),
      rows,
    }, teamIndex);
  } catch (err) {
    resultEl.innerHTML = "";
    setStatus("Error: " + err.message, true);
  } finally {
    document.getElementById("go").disabled = false;
  }
}

document.getElementById("go").addEventListener("click", compare);
initSwap(compare, () => teamIndex);
initCopyLink();
initInputLogos(() => teamIndex);
initModes(compare);
initChartTips();
initRivalries([
  ["Michigan", "Ohio State"],
  ["Alabama", "Auburn"],
  ["Army", "Navy"],
  ["Texas", "Oklahoma"],
  ["USC", "Notre Dame"],
], compare);
document.getElementById("team2").addEventListener("keydown", e => { if (e.key === "Enter") compare(); });
document.getElementById("team1").addEventListener("keydown", e => { if (e.key === "Enter") compare(); });

if (!window.H2H_PROXY) {
  setStatus("No proxy URL set — set window.H2H_PROXY in proxy-config.js.", true);
} else {
  loadTeams().then(() => autoRunFromUrl(compare));
}
</script>

</body>
</html>
